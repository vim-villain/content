summary: Move across punctuation-joined WORDS with W.
instructions: |
  Move the cursor to the start of the second WORD.

  A WORD is a run of non-blank characters, so punctuation keeps
  alpha-beta together. Press W to jump to the next WORD start.
hints:
  - W moves to the next WORD start.
  - Punctuation does not split a WORD.
