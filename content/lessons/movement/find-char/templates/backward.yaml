id: template.find-char.backward
lesson: lesson.find-char
order: 20
status: active
type: move-to-target
engine: ">=0.4.0 <0.5.0"
title: Find the dash backward
description: Move backward from the end of the line to the dash.
notes: |
  The line is two words joined by a literal dash: word1 + "-" + word2.
  The cursor starts at the line end and the dash is behind it, so F- is
  invariant under word substitution.
generate:
  - op: pick
    name: words
    pool: words.common
    count: 2
    unique: true
    constraints:
      length: { min: 3, max: 7 }
      charset: ascii-lower
  - op: line
    name: line
    parts:
      - ref: words.0
        as: first
      - text: "-"
        as: dash
      - ref: words.1
        as: second
  - op: buffer
    name: buffer
    lines:
      - ref: line
initial:
  buffer: { ref: buffer }
  cursor: { line: 0, at: line.second, edge: last }
goal:
  kind: cursor
  cursor: { line: 0, at: line.dash, edge: start }
allowed: ["F", "-", "Escape"]
solution:
  keys: ["F", "-"]
par: 2
