id: lesson.delete-word
slug: delete-word
title: Delete text
group: operators
order: 20
difficulty: 2
skills:
  - "skill.operator.delete"
summary: Remove a word or a whole line with the delete operator.
instructions: |
  Remove the requested text with the delete operator.

  Combine d with w to remove from the cursor to the next word start.
  Press d twice to delete the current line.
hints:
  - d is the delete operator; it waits for a motion.
  - dw deletes a word, dd deletes a line.
keyLegend:
  - "d"
  - "w"
