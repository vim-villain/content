summary: Jump to the start of the previous word.
instructions: |
  Move the cursor to the start of the first word.

  Press b to jump back one word. A count repeats the motion: 2b moves
  two words at once.
hints:
  - b moves to the start of the previous word.
  - A count before b repeats it, so 2b moves two words.
