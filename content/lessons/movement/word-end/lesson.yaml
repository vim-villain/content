summary: Move to the end of a word with e.
instructions: |
  Move the cursor to the last character of the third word.

  Press e to jump to the end of the current or next word. Repeating it
  walks forward one word end at a time.
hints:
  - e moves to the end of the current or next word.
  - Repeat e to reach later word ends.
