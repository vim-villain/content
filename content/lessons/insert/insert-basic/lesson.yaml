summary: Enter insert mode and add text at the cursor.
instructions: |
  Add the word done in the requested position.

  Press i to insert before the cursor. Press a to append after the cursor.
  Type the text, then press Escape to return to normal mode.
hints:
  - i inserts before the cursor; a appends after it.
  - Type the text, then press Escape to finish.
keyLegend:
