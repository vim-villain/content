id: skill.insert.basic
title: Basic insert
group: insert
order: 20
summary: Enter insert mode, type text, and leave with Escape.
description: |
  Insert mode adds text at the cursor. Use i to insert before the cursor
  and a to append after it. A and I work at the line edges. Escape
  returns to normal mode when the text is complete.
prerequisites:
  - "skill.motion.char"
tags:
  - "insert"
status: active
