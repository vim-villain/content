summary: Repeat a motion with a numeric count.
instructions: |
  Move the cursor to the start of the fourth word.

  Type a count before a motion to repeat it. 3w moves forward three word
  starts, which is the same as pressing w three times.
hints:
  - A count before a motion repeats it.
  - 3w is three word motions.
